# CipherBot — single-service deployment.
#
#   cp .env.example .env        # set DISCORD_TOKEN
#   mkdir -p data && sudo chown 10001:10001 data   # container runs as uid 10001
#   docker compose up -d --build
#
# The SQLite database lives in ./data (one instance per database file — do not
# scale this service horizontally).

services:
  cipherbot:
    build:
      context: .
      args:
        VERSION: "1.0.0"
    # Built locally by default; `docker compose push` publishes it after
    # `docker login ghcr.io`. CI publishes tags on v* releases.
    image: ghcr.io/cleeryy/cipherbot:latest
    container_name: cipherbot
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/cipherbot.db
      HEALTH_ADDR: 0.0.0.0:8080
      SQLITE_TMPDIR: /tmp
      TMPDIR: /tmp
    volumes:
      - ./data:/data
    ports:
      # Bind to 127.0.0.1:8080 when a reverse proxy terminates TLS in front of
      # the bot, or remove the mapping entirely and scrape /metrics internally.
      - "8080:8080"
    restart: unless-stopped
    # The binary drains shards on SIGINT (Ctrl+C); make `docker stop` use it.
    stop_signal: SIGINT
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # Hardening. The root filesystem is immutable; SQLite writes go to /data,
    # temporary files go to tmpfs.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
